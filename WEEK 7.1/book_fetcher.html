<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Fetcher</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f4ff;color:#1a2340}header{background:#1a2540;color:white;text-align:center;padding:32px 16px}header p{color:#c5d2ed}main{max-width:1100px;margin:auto;padding:24px 18px}form{display:flex;gap:10px;max-width:680px;margin:0 auto 26px}input{flex:1;min-width:0;padding:13px;border:1px solid #c8d4f0;border-radius:9px;font-size:16px}button{background:#1a56db;color:white;border:0;padding:12px 22px;border-radius:9px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}#status{padding:12px;border-radius:8px;margin:14px 0}#status.info{background:white}#status.error{background:#fee2e2;color:#b91c1c}#status.empty{background:#fef3c7;color:#92400e}#results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.book-card{background:white;border:1px solid #c8d4f0;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s}.book-card:hover{transform:translateY(-3px)}.book-card img,.no-cover,.skeleton-img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#dbeafe}.no-cover{display:grid;place-items:center;font-size:40px}.card-body{padding:12px}.card-body h3{font-size:14px;line-height:1.4;margin:0}.card-body p{font-size:12px;color:#5a6a8a;line-height:1.5}.skeleton{background:white;border-radius:10px;overflow:hidden}.skeleton-img,.skeleton-line{background:#dbe3f3;animation:pulse 1s infinite alternate}.skeleton-body{padding:12px}.skeleton-line{height:12px;margin:8px 0;border-radius:4px}.short{width:60%}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff77;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}footer{text-align:center;padding:20px;color:#5a6a8a;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{opacity:.35}}@media(max-width:520px){form{gap:7px}input{font-size:14px;padding:11px}button{padding:11px 14px}#results-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style></head>
<body><header><h1>📚 Book Fetcher</h1><p>Discover your next favourite read with Open Library</p></header>
<main><form id="search-form"><input id="search-input" type="search" placeholder="Try Harry Potter, Dune, or an author…" aria-label="Search books by title or author" required><button id="search-btn">Search</button></form>
<h2>Book Results</h2><p id="status" class="info" aria-live="polite">Search for a title or author to get started.</p><div id="results-grid"></div></main>
<footer>Book data provided by Open Library · Click a book to explore more</footer>
<script>
const form=document.getElementById('search-form'),input=document.getElementById('search-input'),status=document.getElementById('status'),grid=document.getElementById('results-grid'),btn=document.getElementById('search-btn');
function setStatus(type,message){status.className=type;status.textContent=message}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showSkeletons(){grid.innerHTML='';for(let i=0;i<6;i++){const el=document.createElement('div');el.className='skeleton';el.innerHTML='<div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>';grid.appendChild(el)}}
function renderResults(books){grid.innerHTML='';books.forEach(book=>{const card=document.createElement('article');card.className='book-card';card.tabIndex=0;card.setAttribute('role','link');card.setAttribute('aria-label','Open book details for '+(book.title||'book'));const image=book.cover_i?'<img loading="lazy" alt="Book cover" src="https://covers.openlibrary.org/b/id/'+book.cover_i+'-M.jpg">':'<div class="no-cover" aria-label="No cover available">📚</div>';card.innerHTML=image+'<div class="card-body"><h3>'+esc(book.title||'Unknown title')+'</h3><p>'+esc(book.author_name?.[0]||'Unknown author')+(book.first_publish_year?' · '+book.first_publish_year:'')+'</p></div>';const open=()=>window.open('https://openlibrary.org/search?q='+encodeURIComponent(book.title||''),'_blank','noopener');card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});grid.appendChild(card)})}
async function searchBooks(query){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Searching…';showSkeletons();setStatus('info','Searching Open Library…');try{const response=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&limit=12');if(!response.ok)throw new Error('Server error '+response.status);const data=await response.json();if(!data.docs||data.docs.length===0){grid.innerHTML='';setStatus('empty','📭 No books found for "'+query+'". Try another search.');return}renderResults(data.docs);setStatus('info','Showing '+data.docs.length+' of '+data.numFound+' results for "'+query+'".')}catch(error){grid.innerHTML='';setStatus('error','⚠ '+(error.message||'Something went wrong')+' — check your internet connection and try again.')}finally{btn.disabled=false;btn.textContent='Search'}}
form.addEventListener('submit',e=>{e.preventDefault();const query=input.value.trim();if(query)searchBooks(query)});
</script></body></html>
