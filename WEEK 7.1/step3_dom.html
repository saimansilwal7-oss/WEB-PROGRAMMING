<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step 3 - DOM Form</title><style>body{font-family:Arial;background:#f0f4ff;color:#1a2340;margin:0}header{background:#1a2540;color:white;text-align:center;padding:28px}form{display:flex;gap:10px;max-width:600px;margin:30px auto;padding:0 16px}input{flex:1;padding:12px;border:1px solid #c8d4f0;border-radius:8px}button{background:#1a56db;color:white;border:0;padding:12px 22px;border-radius:8px}main{max-width:900px;margin:auto;padding:20px}#status{padding:12px;background:white;border-radius:8px}</style></head><body><header><h1>📚 Book Search</h1><p>Step 3 — Wire the form with JavaScript</p></header><main><form id="search-form"><input id="search-input" placeholder="Type a book title or author" required><button>Search</button></form><p id="status">Type a title or author above and press Search.</p></main><script>const form=document.getElementById('search-form');const input=document.getElementById('search-input');const status=document.getElementById('status');form.addEventListener('submit',function(e){e.preventDefault();const query=input.value.trim();if(!query)return;status.textContent='Searching: '+query;console.log('Query:',query);});</script></body></html>
