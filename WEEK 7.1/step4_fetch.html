<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step 4 - Fetch API</title><style>body{font-family:Arial;background:#f0f4ff;color:#1a2340;margin:0}header{background:#1a2540;color:white;text-align:center;padding:28px}form{display:flex;gap:10px;max-width:600px;margin:30px auto;padding:0 16px}input{flex:1;padding:12px;border:1px solid #c8d4f0;border-radius:8px}button{background:#1a56db;color:white;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}main{max-width:900px;margin:auto;padding:20px}#status{padding:12px;border-radius:8px;background:white} .error{color:#b91c1c;background:#fee2e2!important}</style></head><body><header><h1>📚 Book Search</h1><p>Step 4 — Fetch books from Open Library</p></header><main><form id="search-form"><input id="search-input" placeholder="Search books…" required><button id="search-btn">Search</button></form><p id="status">Search a title or author. Open the console to inspect the API response.</p></main><script>const form=document.getElementById('search-form'),input=document.getElementById('search-input'),status=document.getElementById('status'),btn=document.getElementById('search-btn');async function searchBooks(query){status.className='';status.textContent='Searching…';btn.disabled=true;try{const url='https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&limit=12';const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();console.log('Found:',data.numFound);console.log('First book:',data.docs[0]);status.textContent='Found '+data.numFound+' results for "'+query+'". Check the browser console for book data.';}catch(err){status.className='error';status.textContent='Could not fetch books: '+err.message;}finally{btn.disabled=false;}}form.addEventListener('submit',e=>{e.preventDefault();const query=input.value.trim();if(query)searchBooks(query);});</script></body></html>
