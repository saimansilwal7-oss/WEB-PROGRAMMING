<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step 5 - Render Book Cards</title><style>:root{--dark:#1a2540;--accent:#1a56db;--bg:#f0f4ff;--border:#c8d4f0;--muted:#5a6a8a}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#1a2340}header{background:var(--dark);color:white;text-align:center;padding:28px}form{display:flex;gap:10px;max-width:600px;margin:30px auto;padding:0 16px}input{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:8px}button{background:var(--accent);color:white;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}main{max-width:1100px;margin:auto;padding:20px}#status{padding:12px;background:white;border-radius:8px;margin-bottom:16px}#results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.book-card{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden}.book-card img,.no-cover{width:100%;aspect-ratio:2/3;object-fit:cover;background:#dbeafe}.no-cover{display:grid;place-items:center;font-size:42px}.card-body{padding:12px}.card-body h3{font-size:14px;line-height:1.4}.card-body p{font-size:12px;color:var(--muted)}</style></head><body><header><h1>📚 Book Search</h1><p>Step 5 — Display book results</p></header><main><form id="search-form"><input id="search-input" placeholder="Search books…" required><button>Search</button></form><p id="status">Try “Dune” or “Harry Potter”.</p><div id="results-grid"></div></main><script>const form=document.getElementById('search-form'),input=document.getElementById('search-input'),status=document.getElementById('status'),grid=document.getElementById('results-grid');function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function renderResults(books){grid.innerHTML='';books.forEach(book=>{const card=document.createElement('article');card.className='book-card';const cover=book.cover_i?'https://covers.openlibrary.org/b/id/'+book.cover_i+'-M.jpg':'';const image=cover?'<img loading="lazy" alt="Book cover" src="'+cover+'">':'<div class="no-cover">📚</div>';const title=escapeHtml(book.title||'Unknown title'),author=escapeHtml(book.author_name?.[0]||'Unknown author'),year=book.first_publish_year||'';card.innerHTML=image+'<div class="card-body"><h3>'+title+'</h3><p>'+author+(year?' · '+year:'')+'</p></div>';grid.appendChild(card);});}async function searchBooks(query){status.textContent='Searching…';grid.innerHTML='';try{const res=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&limit=12');if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data.docs.length){status.textContent='No books found. Try another search.';return;}status.textContent='Showing '+data.docs.length+' of '+data.numFound+' results.';renderResults(data.docs);}catch(err){status.textContent='Error loading books: '+err.message;}}form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(q)searchBooks(q);});</script></body></html>
