<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step 6 - Polish & Error Handling</title><style>:root{--dark:#1a2540;--accent:#1a56db;--bg:#f0f4ff;--border:#c8d4f0;--muted:#5a6a8a}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:#1a2340}header{background:var(--dark);color:white;text-align:center;padding:28px}form{display:flex;gap:10px;max-width:650px;margin:30px auto;padding:0 16px}input{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:8px}button{background:var(--accent);color:white;border:0;padding:12px 22px;border-radius:8px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}main{max-width:1100px;margin:auto;padding:20px}#status{padding:12px;border-radius:8px;margin-bottom:16px}#status.info{background:white}#status.error{background:#fee2e2;color:#b91c1c}#status.empty{background:#fef3c7;color:#92400e}#results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.book-card,.skeleton{background:white;border:1px solid var(--border);border-radius:10px;overflow:hidden}.book-card img,.no-cover,.skeleton-img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#dbeafe}.no-cover{display:grid;place-items:center;font-size:42px}.card-body,.skeleton-body{padding:12px}.card-body h3{font-size:14px}.card-body p{font-size:12px;color:var(--muted)}.skeleton-img,.skeleton-line{background:#dbe3f3;animation:pulse 1s infinite alternate}.skeleton-line{height:12px;margin:8px 0;border-radius:4px}.short{width:60%}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff77;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{opacity:.35}}</style></head><body><header><h1>📚 Book Search</h1><p>Step 6 — Loading, empty and error states</p></header><main><form id="search-form"><input id="search-input" placeholder="Search books…" required><button id="search-btn">Search</button></form><p id="status" class="info">Search for a title or author to get started.</p><div id="results-grid"></div></main><script>const form=document.getElementById('search-form'),input=document.getElementById('search-input'),status=document.getElementById('status'),grid=document.getElementById('results-grid'),btn=document.getElementById('search-btn');function setStatus(type,msg){status.className=type;status.textContent=msg;}function showSkeletons(){grid.innerHTML='';for(let i=0;i<6;i++){const el=document.createElement('div');el.className='skeleton';el.innerHTML='<div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>';grid.appendChild(el);}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function renderResults(books){grid.innerHTML='';books.forEach(b=>{const card=document.createElement('article');card.className='book-card';const image=b.cover_i?'<img loading="lazy" alt="Book cover" src="https://covers.openlibrary.org/b/id/'+b.cover_i+'-M.jpg">':'<div class="no-cover">📚</div>';card.innerHTML=image+'<div class="card-body"><h3>'+esc(b.title||'Unknown title')+'</h3><p>'+esc(b.author_name?.[0]||'Unknown author')+(b.first_publish_year?' · '+b.first_publish_year:'')+'</p></div>';grid.appendChild(card);});}async function searchBooks(q){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Searching…';showSkeletons();setStatus('info','Searching Open Library…');try{const res=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(q)+'&limit=12');if(!res.ok)throw new Error('Server error '+res.status);const data=await res.json();if(!data.docs||data.docs.length===0){grid.innerHTML='';setStatus('empty','📭 No books found for "'+q+'" — try another query.');return;}renderResults(data.docs);setStatus('info','Showing '+data.docs.length+' of '+data.numFound+' results for "'+q+'".');}catch(err){grid.innerHTML='';setStatus('error','⚠ '+err.message+' — check your internet connection and try again.');}finally{btn.disabled=false;btn.textContent='Search';}}form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(q)searchBooks(q);});</script></body></html>
