<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Step 2 - CSS Styling</title>
<style>
:root{--dark:#1a2540;--accent:#1a56db;--bg:#f0f4ff;--surf:#fff;--border:#c8d4f0;--text:#1a2340;--muted:#5a6a8a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);padding:32px;text-align:center;color:#fff}header p{color:#94a3b8}form{display:flex;gap:10px;max-width:600px;margin:32px auto;padding:0 16px}input{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:16px}button{background:var(--accent);color:#fff;border:0;padding:12px 24px;border-radius:8px;cursor:pointer}#results-section{max-width:1000px;margin:auto;padding:20px}#results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}.book-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;overflow:hidden}.book-card img{width:100%;aspect-ratio:2/3;object-fit:cover}.card-body{padding:12px}.card-body p{font-size:12px;color:var(--muted)}
</style></head><body><header><h1>📚 Book Search</h1><p>Search the Open Library — millions of books, free</p></header><main><form id="search-form"><input id="search-input" placeholder="Search books…" required><button>Search</button></form><section id="results-section"><h2>Results</h2><div id="results-grid"><article class="book-card"><img src="https://covers.openlibrary.org/b/id/8091016-M.jpg" alt="Sample cover"><div class="card-body"><h3>The Great Gatsby</h3><p>F. Scott Fitzgerald · 1925</p></div></article></div></section></main></body></html>
