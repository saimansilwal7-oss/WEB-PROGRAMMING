<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E2 - Required and Pattern Attributes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; font-family: Arial, sans-serif; background: #f1f5f9; color: #1f2937; }
    main { max-width: 560px; margin: auto; padding: 28px; background: white; border-radius: 14px; box-shadow: 0 8px 25px #0f172a12; }
    h1 { margin-top: 0; color: #4338ca; }
    .intro, .hint { color: #64748b; line-height: 1.5; }
    .field { margin: 18px 0; }
    label { display: block; margin-bottom: 7px; font-weight: 600; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; }
    input:focus { outline: 3px solid #c7d2fe; border-color: #4f46e5; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 7px; color: white; background: #4f46e5; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:hover { background: #3730a3; }
  </style>
</head>
<body>
  <main>
    <h1>Registration Validation</h1>
    <p class="intro">Complete each field and try submitting with incorrect values to see the browser's built-in validation.</p>
    <form action="/register" method="post">
      <div class="field">
        <label for="student-id">Student ID</label>
        <input type="text" id="student-id" name="studentId" pattern="\d{9}" title="Enter exactly 9 digits with no spaces." placeholder="Example: 202537200" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="student@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="16" max="100" placeholder="16–100" required>
      </div>
      <button type="submit">Submit Registration</button>
    </form>
    <p class="hint">Validation rules: Student ID must be 9 digits; email is required; password needs at least 8 characters; age must be from 16 to 100.</p>
  </main>
</body>
</html>
