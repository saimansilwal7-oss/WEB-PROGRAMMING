<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Form | Week 8.1</title>
<style>
:root{color-scheme:light;--ink:#20213b;--muted:#747994;--purple:#6657d9;--pink:#ff829f;--line:#e4e3f0;--green:#16845b;--red:#c73550}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;font-family:Inter,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#e9e5ff,transparent 32%),radial-gradient(circle at 95% 95%,#ffe6ed,transparent 30%),#f7f7fc}.wrap{width:min(100%,760px);margin:auto}.eyebrow{color:var(--purple);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero{text-align:center;margin:8px 0 25px}.hero h1{font-size:clamp(32px,6vw,48px);letter-spacing:-1.5px;margin:10px 0}.hero h1 span{color:var(--purple)}.hero p:last-child{color:var(--muted);line-height:1.65}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,38px);box-shadow:0 18px 50px #29245b12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}.field.full{grid-column:1/-1}.field label,legend{font-size:13px;font-weight:750}.field input,.field textarea,.field select{width:100%;padding:13px 14px;border:1.5px solid #dcdbea;border-radius:11px;background:#fdfdff;color:var(--ink);font:inherit;outline:none;transition:border-color .18s,box-shadow .18s}.field textarea{min-height:145px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6657d91c}.field input:valid:not(:placeholder-shown),.field textarea:valid:not(:placeholder-shown){border-color:var(--green)}.field input:invalid:not(:placeholder-shown),.field textarea:invalid:not(:placeholder-shown){border-color:var(--red);background:#fffafb}.hint{font-size:11px;color:var(--muted);line-height:1.5}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:5px}.submit{border:0;border-radius:12px;padding:14px 22px;background:var(--purple);color:white;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 8px 18px #6657d932}.submit:hover{background:#5142c3;transform:translateY(-1px)}.privacy{color:var(--muted);font-size:11px}.status{display:none;margin-top:18px;padding:13px 15px;border-radius:11px;background:#e9f8f0;color:#126343;font-size:13px;line-height:1.5}.status.show{display:block}fieldset{border:0;padding:0;margin:0;min-width:0}@media(max-width:560px){.grid{grid-template-columns:1fr;gap:0}.field.full{grid-column:auto}.hero h1{letter-spacing:-.8px}.actions{align-items:stretch;flex-direction:column}.submit{width:100%}.privacy{text-align:center}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><p class="eyebrow">Web Programming · Week 8.1</p><h1>Let's talk<span>.</span></h1><p>Have a question, idea, or project in mind? Send a message using the form below.</p></header>
<section class="card" aria-label="Contact form">
<form id="contact-form" action="#" method="post">
<div class="grid">
<div class="field"><label for="name">Full name *</label><input id="name" name="name" type="text" placeholder="Your name" minlength="2" maxlength="60" autocomplete="name" required><span class="hint">Enter at least 2 characters.</span></div>
<div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" maxlength="120" required><span class="hint">Use a valid email address.</span></div>
<div class="field full"><label for="subject">Subject *</label><input id="subject" name="subject" type="text" placeholder="What is this about?" minlength="3" maxlength="100" required></div>
<div class="field full"><label for="message">Message *</label><textarea id="message" name="message" placeholder="Write your message here..." minlength="10" maxlength="1000" required></textarea><span class="hint">Write between 10 and 1,000 characters.</span></div>
</div>
<div class="actions"><button class="submit" type="submit">Send message <span aria-hidden="true">↗</span></button><span class="privacy">* Required fields · HTML5 validation enabled</span></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</form>
</section>
</main>
<script>
document.querySelector("#contact-form").addEventListener("submit",function(event){event.preventDefault();if(!this.reportValidity())return;const name=document.querySelector("#name").value.trim();const status=document.querySelector("#status");status.textContent="Thanks, "+name+"! Your form is valid. This demo does not send messages to a server.";status.classList.add("show");});
</script>
</body>
</html>
