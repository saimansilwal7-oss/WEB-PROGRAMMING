<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E1 - Login Form</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; font-family: Arial, sans-serif; background: linear-gradient(135deg, #dbeafe, #ede9fe); color: #1f2937; }
    .login-card { width: 100%; max-width: 420px; padding: 32px; background: white; border-radius: 16px; box-shadow: 0 12px 35px #1e293b20; }
    h1 { margin: 0 0 8px; text-align: center; color: #4338ca; }
    .intro { margin: 0 0 26px; text-align: center; color: #6b7280; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input[type="email"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    input:focus { outline: 3px solid #c7d2fe; border-color: #4f46e5; }
    .remember { display: flex; align-items: center; gap: 9px; margin: 6px 0 22px; }
    .remember label { margin: 0; font-weight: normal; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 8px; background: #4f46e5; color: white; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:hover { background: #3730a3; }
    .note { margin: 16px 0 0; text-align: center; color: #64748b; font-size: .82rem; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome Back</h1>
    <p class="intro">Sign in to your account</p>
    <form action="/login" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <div class="remember">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>
      </div>
      <button type="submit">Log In</button>
    </form>
    <p class="note">E1 · Week 8.1 · Login form practice</p>
  </main>
</body>
</html>
