<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Optimized Budget Tracker Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf4ff;font:16px/1.5 system-ui}main{max-width:720px;margin:auto;padding:24px 16px}.box{background:#15243a;border:1px solid #344b69;border-radius:16px;padding:20px;margin:14px 0}form{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #526783}button{background:#8be0c3;color:#102033;font-weight:700}ul{padding:0;list-style:none}li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #344b69}.total{font-size:1.7rem;font-weight:800;color:#8be0c3}@media(max-width:520px){form{grid-template-columns:1fr}}</style></head><body><main><h1>Student Budget Tracker</h1><p>Responsive lightweight demo using deferred JavaScript and local storage.</p><section class="box"><div>Balance</div><div id="balance" class="total">₩0</div><div id="summary">Income ₩0 · Expenses ₩0</div></section><section class="box"><h2>Add transaction</h2><form id="form"><input id="label" placeholder="Description" required maxlength="60"><input id="amount" type="number" min="1" step="1" placeholder="Amount (₩)" required><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button>Add</button></form></section><section class="box"><h2>Transactions</h2><ul id="items" aria-live="polite"></ul><button id="clear" type="button">Clear all</button></section></main><script defer src="optimized-demo.js"></script></body></html>
