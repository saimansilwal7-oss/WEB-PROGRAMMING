<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A working demonstration of deferred and asynchronous JavaScript loading.">
  <title>Script Loading Example | Week 9.2</title>
  <script src="app.js" defer></script>
  <script src="analytics.js" async></script>
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:24px;line-height:1.6;color:#17243a;background:#f3f6fb}
    main{padding:28px;border:1px solid #d8e1ed;border-radius:16px;background:#fff}
    .status{padding:12px 16px;border-radius:8px;background:#fff7ed;color:#9a3412}
    .ok{background:#ecfdf5;color:#166534}
    code{background:#eef2ff;padding:2px 6px;border-radius:4px}
  </style>
</head>
<body>
  <main>
    <h1>Script Loading Demo</h1>
    <p>This page demonstrates two real JavaScript files: one loaded with <code>defer</code> and one loaded with <code>async</code>.</p>
    <p id="status" class="status" role="status" aria-live="polite">Waiting for the deferred script...</p>
    <p id="analytics-status">The async demonstration script is loading.</p>
  </main>
</body>
</html>
