
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team 4 - Student Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💰 Student Budget Tracker</h1>
    <p>Manage your money, one step at a time.</p>
  </header>

  <main>
    <section class="summary">
      <div class="card">
        <h3>Total Balance</h3>
        <p id="balance">₩0</p>
      </div>
      <div class="card">
        <h3>Income</h3>
        <p id="income">₩0</p>
      </div>
      <div class="card">
        <h3>Expenses</h3>
        <p id="expenses">₩0</p>
      </div>
    </section>

    <section class="card">
      <h2>Monthly Budget</h2>
      <form id="budget-form">
        <label for="budget-limit">Set your budget (KRW)</label>
        <input type="number" id="budget-limit" min="1"
          placeholder="Example: 500000" required>
        <button type="submit">Save Budget</button>
      </form>

      <p>Monthly budget: <strong id="budget-total">₩0</strong></p>
      <p>Money spent: <strong id="budget-spent">₩0</strong></p>
      <p id="budget-message">Set a budget to get started.</p>
      <progress id="budget-progress" value="0" max="100"></progress>
    </section>

    <section class="card">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <label for="description">Description</label>
        <input id="description" placeholder="e.g. Lunch" required>

        <label for="amount">Amount (KRW)</label>
        <input id="amount" type="number" min="1"
          placeholder="e.g. 10000" required>

        <label for="type">Transaction Type</label>
        <select id="type">
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <label for="category">Category</label>
        <select id="category">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Housing">Housing</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>

        <button type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="card">
      <h2>Transaction History</h2>
      <ul id="transactions"></ul>
    </section>
  </main>

  <footer>Team 4 · Gachon University · Computer Engineering</footer>
  <script src="app.js" defer></script>
</body>
</html>
