<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accessible button examples using native HTML buttons and keyboard focus styles.">
  <title>Accessible Buttons | Week 9.1</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.6 system-ui,sans-serif;color:#17243a;background:#f3f6fb}.wrap{width:min(100%,680px);margin:auto}main{padding:24px;border:1px solid #d8e1ed;border-radius:14px;background:#fff}h1{margin-top:0;font-size:clamp(1.6rem,5vw,2.2rem)}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:22px 0}.btn{min-height:44px;padding:10px 20px;border:0;border-radius:8px;background:#155e45;color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn:hover{background:#104b37}.close-btn{width:44px;height:44px;border:0;border-radius:50%;background:#a61b1b;color:#fff;font-size:20px;cursor:pointer}.btn:focus-visible,.close-btn:focus-visible{outline:3px solid #174a86;outline-offset:4px}#result{min-height:48px;padding:12px;border-radius:8px;background:#edf4ff;color:#17243a} .hint{color:#46566d}
  .skip-link{position:absolute;top:8px;left:8px;z-index:20;padding:10px 14px;border-radius:7px;background:#17243a;color:#fff;transform:translateY(-160%)}.skip-link:focus{transform:translateY(0)}\n  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" class="wrap" tabindex="-1">
    <h1>Accessible Buttons</h1>
    <p class="hint">Use the Tab key to move between controls, then press Enter or Space to activate the focused button.</p>
    <div class="actions">
      <button class="btn" id="submit-button" type="button">Submit form</button>
      <button class="close-btn" id="close-button" type="button" aria-label="Close message">×</button>
    </div>
    <p id="result" role="status" aria-live="polite">No button has been activated yet.</p>
  </main>
  <script>
    "use strict";
    const result = document.getElementById("result");
    document.getElementById("submit-button").addEventListener("click", () => {
      result.textContent = "Submit button activated. This is a demonstration; no form data was sent.";
    });
    document.getElementById("close-button").addEventListener("click", () => {
      result.textContent = "Close button activated. Its accessible name is “Close message”.";
    });
  </script>
</body>
</html>
